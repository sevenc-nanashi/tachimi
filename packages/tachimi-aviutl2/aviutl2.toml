[project]
id = "sevenc-nanashi.tachimi"
name = "tachimi.aux2"
version = "0.0.0"

[development]
aviutl2_version = "latest"

[artifacts.tachimi]
destination = "Plugin/tachimi.aux2"

[artifacts.tachimi.profiles.debug]
build = "cargo build -p tachimi-aviutl2"
source = "../../target/debug/tachimi_aviutl2.dll"

[artifacts.tachimi.profiles.release]
build = "cargo build --release -p tachimi-aviutl2"
source = "../../target/release/tachimi_aviutl2.dll"
