[package]
name = "tachimi-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "tachimi"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
usage-rs = { version = "7", features = ["completions"] }
tachimi-common.workspace = true
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
hooq = "0.3.1"
dirs = "7.0.0"
ureq = "3.5.0"
tempfile = "3.27.0"
ring = "0.17.14"
zip = { version = "9.0.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
lazy-regex = "3.6.2"
dunce = "1.0.5"

[build-dependencies]
winresource = "0.1.34"
