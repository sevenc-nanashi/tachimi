name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Build version (e.g. 0.2.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Prepare YMM4 references
        working-directory: packages/tachimi-ymm4
        run: bun run download:ymm4
      - run: bun install --frozen-lockfile
      - name: Set version
        if: github.event_name == 'workflow_dispatch'
        env:
          BUILD_VERSION: ${{ inputs.version }}
        run: bun tools/set-version.ts "$env:BUILD_VERSION"
      - run: bun run build
      - uses: actions/upload-artifact@v7
        with:
          name: tachimi-windows
          path: |
            dist/*.zip
            dist/*.ymme
          if-no-files-found: error
          compression-level: 0

  release:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: tachimi-windows
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: gh release create "v$RELEASE_VERSION" dist/*.zip dist/*.ymme --target "$GITHUB_SHA" --generate-notes
