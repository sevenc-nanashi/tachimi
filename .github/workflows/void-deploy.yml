name: Deploy to Cloudflare
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: void-cloudflare-deploy-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: bun install --frozen-lockfile
      - name: Install Chromium for docs OG images
        run: bunx --package playwright@1.64.1 playwright install --with-deps chromium
      - name: Deploy
        working-directory: packages/tachimi-server
        env:
          # Add this scoped token at Settings → Secrets and variables → Actions.
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # Required when the token can access multiple accounts.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # Required in fresh checkouts when a Worker Version has no preview URL.
          CLOUDFLARE_WORKERS_SUBDOMAIN: ${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}
        run: bunx --no-install void deploy --platform cloudflare
